<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký CLB Lập trình Web</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      padding: 40px 16px;
      background: #e9ecef;
      font-family: Arial, sans-serif;
    }

    .registration-card {
      max-width: 900px;
      margin: 0 auto;
      border: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    .registration-card .card-header {
      padding: 18px;
    }

    .registration-card .card-body {
      padding: 30px;
    }

    @media (max-width: 576px) {
      body {
        padding: 20px 12px;
      }

      .registration-card .card-body {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card registration-card">
      <header class="card-header bg-success text-white text-center">
        <h1 class="h3 mb-0">Đăng ký tham gia CLB Lập trình Web</h1>
      </header>

      <div class="card-body">
        <form action="#" method="get">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="full-name" class="form-label">Họ và tên</label>
              <input
                type="text"
                class="form-control"
                id="full-name"
                name="fullName"
                placeholder="Nguyễn Văn A"
                autocomplete="name"
                required>
            </div>

            <div class="col-12 col-md-6">
              <label for="student-id" class="form-label">Mã sinh viên</label>
              <input
                type="text"
                class="form-control"
                id="student-id"
                name="studentId"
                placeholder="22xxxxxx"
                required>
            </div>

            <div class="col-12 col-md-6">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="sv@tlu.edu.vn"
                autocomplete="email"
                required>
            </div>

            <div class="col-12 col-md-6">
              <label for="phone" class="form-label">Số điện thoại</label>
              <input
                type="tel"
                class="form-control"
                id="phone"
                name="phone"
                placeholder="09xxxxxxxx"
                autocomplete="tel"
                pattern="[0-9]{10,11}"
                title="Nhập số điện thoại gồm 10 hoặc 11 chữ số"
                required>
            </div>

            <fieldset class="col-12">
              <legend class="col-form-label pt-0">Trình độ</legend>

              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="level"
                  id="level-basic"
                  value="Co-ban"
                  required>
                <label class="form-check-label" for="level-basic">Cơ bản</label>
              </div>

              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="level"
                  id="level-medium"
                  value="Kha"
                  required>
                <label class="form-check-label" for="level-medium">Khá</label>
              </div>

              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="level"
                  id="level-good"
                  value="Tot"
                  required>
                <label class="form-check-label" for="level-good">Tốt</label>
              </div>
            </fieldset>

            <div class="col-12">
              <label for="class-name" class="form-label">Chọn lớp</label>
              <select
                class="form-select"
                id="class-name"
                name="className"
                required>
                <option value="" selected disabled>-- Chọn lớp --</option>
                <option value="67CNTT1">67CNTT1</option>
                <option value="67CNTT2">67CNTT2</option>
                <option value="67KTPM1">67KTPM1</option>
                <option value="67KTPM2">67KTPM2</option>
              </select>
            </div>

            <div class="col-12">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="commitment"
                  name="commitment"
                  required>
                <label class="form-check-label" for="commitment">
                  Tôi cam kết tự làm bài và quay video OBS
                </label>
              </div>
            </div>

            <div class="col-12 d-flex justify-content-end gap-2 mt-4">
              <button type="reset" class="btn btn-outline-secondary">
                Nhập lại
              </button>
              <button type="submit" class="btn btn-success px-4">
                Đăng ký
              </button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
