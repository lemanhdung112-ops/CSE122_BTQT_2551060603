<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bảng điều khiển</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #e9ecef;
            color: #212529;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            flex: 0 0 230px;
            width: 230px;
            min-height: 100vh;
            background: #212529;
            color: #fff;
        }

        .sidebar-brand {
            padding: 16px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 700;
        }

        .sidebar .nav {
            padding: 7px;
        }

        .sidebar .nav-link {
            padding: 9px 14px;
            color: rgba(255, 255, 255, 0.62);
            border-radius: 6px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link:focus {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar .nav-link.active {
            color: #fff;
            background: #0d6efd;
        }

        .dashboard {
            min-width: 0;
            flex: 1;
            padding: 22px 20px;
        }

        .stat-card {
            height: 100%;
            border: 0;
            box-shadow: 0 2px 5px rgba(33, 37, 41, 0.1);
        }

        .stat-label {
            margin-bottom: 4px;
            color: #6c757d;
            font-size: 14px;
        }

        .stat-value {
            margin-bottom: 10px;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-card .progress {
            height: 5px;
            background: #e9ecef;
        }

        .chapter-list {
            overflow: hidden;
            border: 0;
            box-shadow: 0 2px 5px rgba(33, 37, 41, 0.1);
        }

        .chapter-list .list-group-item {
            padding: 8px 14px;
        }

        @media (max-width: 767.98px) {
            .sidebar {
                width: 100%;
                min-height: auto;
                flex-basis: 100%;
            }

            .sidebar .nav {
                flex-direction: row !important;
                gap: 4px;
            }

            .sidebar .nav-link {
                padding: 8px 10px;
            }

            .dashboard {
                padding: 20px 14px;
            }
        }
    </style>
</head>

<body>
    <div class="d-flex flex-column flex-md-row min-vh-100">
        <aside class="sidebar" aria-label="Thanh điều hướng">
            <div class="sidebar-brand">CSE.TLU Admin</div>
            <nav class="nav flex-column">
                <a class="nav-link active" href="#" aria-current="page">Bảng điều khiển</a>
                <a class="nav-link" href="#">Bài tập</a>
                <a class="nav-link" href="#">Sinh viên</a>
                <a class="nav-link" href="#">Điểm số</a>
            </nav>
        </aside>

        <main class="dashboard">
            <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <h1 class="h3 mb-0 fw-bold">Bảng điều khiển</h1>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge text-bg-warning">3 bài mới</span>
                    <button class="btn btn-primary btn-sm" type="button">Xuất báo cáo</button>
                </div>
            </header>

            <section class="row g-3 mb-4" aria-label="Thống kê lớp học">
                <div class="col-12 col-sm-6 col-lg-3">
                    <article class="card stat-card">
                        <div class="card-body p-3">
                            <p class="stat-label">Sinh viên</p>
                            <p class="stat-value">128</p>
                            <div class="progress" role="progressbar" aria-label="Tỉ lệ sinh viên" aria-valuenow="80"
                                aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar bg-primary" style="width: 80%"></div>
                            </div>
                        </div>
                    </article>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <article class="card stat-card">
                        <div class="card-body p-3">
                            <p class="stat-label">Đã nộp</p>
                            <p class="stat-value">96</p>
                            <div class="progress" role="progressbar" aria-label="Tỉ lệ bài đã nộp" aria-valuenow="75"
                                aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar bg-success" style="width: 75%"></div>
                            </div>
                        </div>
                    </article>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <article class="card stat-card">
                        <div class="card-body p-3">
                            <p class="stat-label">Chưa nộp</p>
                            <p class="stat-value">32</p>
                            <div class="progress" role="progressbar" aria-label="Tỉ lệ bài chưa nộp" aria-valuenow="25"
                                aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar bg-danger" style="width: 25%"></div>
                            </div>
                        </div>
                    </article>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <article class="card stat-card">
                        <div class="card-body p-3">
                            <p class="stat-label">Điểm TB</p>
                            <p class="stat-value">7.8</p>
                            <div class="progress" role="progressbar" aria-label="Điểm trung bình" aria-valuenow="78"
                                aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar bg-warning" style="width: 78%"></div>
                            </div>
                        </div>
                    </article>
                </div>
            </section>

            <section class="card chapter-list" aria-labelledby="chapter-heading">
                <h2 id="chapter-heading" class="card-header bg-white fs-6 fw-bold mb-0">Tiến độ theo chương</h2>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Chương 1 — HTML5</span>
                        <span class="badge text-bg-success">100%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Chương 2 — JavaScript</span>
                        <span class="badge text-bg-info">82%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Chương 3 — CSS3</span>
                        <span class="badge text-bg-info">74%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Chương 4 — Bootstrap 5</span>
                        <span class="badge text-bg-secondary">45%</span>
                    </li>
                </ul>
            </section>
        </main>
    </div>
</body>

</html>
