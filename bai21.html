<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống bài tập Lập trình Web</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
      background: #fff;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px 1fr 180px;
      grid-template-rows: 90px 1fr;
    }

    .banner {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 12px 26px;
      color: white;
      background: #c62828 url("Anh/Bai21/Nen_banner.jpg") center / cover;
    }

    .banner img {
      width: 54px;
      height: auto;
    }

    .banner h1 {
      margin: 0;
      font-size: 28px;
      text-shadow: 2px 2px 3px #555;
    }

    .menu {
      background: linear-gradient(#c62828, #8e0000);
    }

    .menu a {
      display: block;
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
    }

    .menu a:hover {
      background: #8e0000;
    }

    .content {
      padding: 26px;
      background: white;
    }

    .content h2 {
      margin: 0 0 16px;
      color: #c62828;
      font-size: 30px;
    }

    .sub-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
      padding: 14px 20px;
      border-radius: 8px;
      background: #ffe082;
    }

    .sub-menu a {
      color: #222;
      font-weight: bold;
      text-decoration: none;
    }

    .sub-menu a::after {
      content: " •";
      margin-left: 10px;
    }

    .sub-menu a:last-child::after {
      content: "";
    }

    .article {
      padding: 28px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 20px;
      line-height: 1.5;
    }

    .article p {
      margin: 0 0 18px;
    }

    .article p:last-child {
      margin-bottom: 0;
      text-align: center;
      font-weight: bold;
    }

    .ads {
      padding: 20px 12px;
      background: #fafafa;
    }

    .ads img {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: 18px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
    }

    @media (max-width: 800px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }

      .banner,
      .menu,
      .content,
      .ads {
        grid-column: auto;
      }

      .banner h1 {
        font-size: 23px;
      }

      .menu {
        display: flex;
        flex-wrap: wrap;
      }

      .menu a {
        flex: 1 1 50%;
        padding: 14px;
      }

      .ads {
        display: flex;
        gap: 15px;
      }

      .ads img {
        width: 50%;
        margin-bottom: 0;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="banner">
      <img src="Anh/Bai21/LogoTT.gif" alt="Logo">
      <h1>Hệ thống bài tập Lập trình Web</h1>
    </header>

    <nav class="menu">
      <a href="#">Ngôn ngữ HTML</a>
      <a href="#">Ngôn ngữ JavaScript</a>
      <a href="#">Các đối tượng trong JavaScript</a>
      <a href="#">CSS và bố cục hiện đại</a>
    </nav>

    <main class="content">
      <h2>Bài tập HTML cơ bản</h2>

      <nav class="sub-menu">
        <a href="#">Đảo chuỗi</a>
        <a href="#">Phân tích chuỗi</a>
        <a href="#">Tìm và thay thế</a>
      </nav>

      <section class="article">
        <p>Thiết kế trang web có nội dung như sau:</p>
        <p>
          Trung Tâm Tin học – ĐH KHTN<br>
          Chào mừng các bạn đến với ngôn ngữ HTML
        </p>
      </section>
    </main>

    <aside class="ads">
      <img src="Anh/Bai21/Qcao01.gif" alt="Quảng cáo 1">
      <img src="Anh/Bai21/Qcao02.gif" alt="Quảng cáo 2">
    </aside>
  </div>
</body>
</html>
