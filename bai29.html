<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách sinh viên</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      padding: 30px 16px;
      background: #f8f9fa;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
    }

    .table {
      min-width: 760px;
      margin-bottom: 0;
      font-size: 18px;
    }

    .table thead th {
      padding: 16px 12px;
      background: #212529;
      color: #fff;
      white-space: nowrap;
    }

    .table tbody td {
      padding: 14px 12px;
      vertical-align: middle;
    }

    .table .score {
      text-align: center;
    }

    .pagination {
      margin-top: 24px;
    }

    @media (max-width: 576px) {
      body {
        padding: 22px 12px;
      }

      .table {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h2 mb-0">Danh sách sinh viên</h1>
      <span class="badge text-bg-primary fs-6">Tổng: 15</span>
    </header>

    <div class="table-responsive shadow-sm rounded-3">
      <table class="table table-striped table-hover align-middle">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Mã SV</th>
            <th scope="col">Họ và tên</th>
            <th scope="col">Lớp</th>
            <th scope="col" class="score">Điểm</th>
            <th scope="col">Trạng thái</th>
          </tr>
        </thead>
        <tbody id="student-rows"></tbody>
      </table>
    </div>

    <nav class="d-flex justify-content-center" aria-label="Phân trang danh sách sinh viên">
      <ul class="pagination" id="pagination"></ul>
    </nav>
  </main>

  <script>
    const students = [
      { id: "2251060001", name: "Nguyễn Văn An", className: "67CNTT1", score: 8.5 },
      { id: "2251060002", name: "Trần Thị Bình", className: "67CNTT1", score: 7.0 },
      { id: "2251060003", name: "Lê Minh Cường", className: "67CNTT2", score: 5.5 },
      { id: "2251060004", name: "Phạm Thu Dung", className: "67KTPM1", score: 9.0 },
      { id: "2251060005", name: "Hoàng Gia Hân", className: "67KTPM1", score: 6.5 },
      { id: "2551060603", name: "Lê Mạnh Dũng", className: "67CNTT2", score: 7.0 },
      { id: "2551060605", name: "Nguyễn Trung Hiếu", className: "67CNTT2", score: 10.0 },
      { id: "2551060620", name: "Nguyễn Xuân Hùng", className: "67CNTT2", score: 9.5 },
      { id: "2551060622", name: "Nguyễn Xuân Hưng", className: "67CNTT2", score: 9.0 },
      { id: "2551060660", name: "Nguyễn Đức Nhật", className: "67CNTT2", score: 10.0 },
      { id: "2551060668", name: "Phạm Minh Quân", className: "67CNTT2", score: 9.5 },
      { id: "2251060006", name: "Lê Duy Hiếu", className: "67KTPM1", score: 9.5 },
      { id: "2251060007", name: "Đỗ Đình Xuân Tiến", className: "67KTPM1", score: 8.0 },
      { id: "2551060609", name: "Nguyễn Ninh Hải", className: "67CNTT2", score: 8.5 },
      { id: "2551060623", name: "Triệu Quốc Hưng", className: "67CNTT2", score: 10.0 },

    ];

    const rowsPerPage = 5;
    const totalPages = Math.ceil(students.length / rowsPerPage);
    const rowsContainer = document.getElementById("student-rows");
    const pagination = document.getElementById("pagination");
    const totalBadge = document.querySelector(".badge");
    let currentPage = 1;

    totalBadge.textContent = `Tổng: ${students.length}`;

    function renderStudents() {
      const start = (currentPage - 1) * rowsPerPage;
      const pageStudents = students.slice(start, start + rowsPerPage);

      rowsContainer.innerHTML = pageStudents.map((student, index) => {
        const passed = student.score >= 6;
        const badgeClass = passed ? "text-bg-success" : "text-bg-warning";
        const statusText = passed ? "Đạt" : "Thi lại";

        return `
          <tr>
            <td>${start + index + 1}</td>
            <td>${student.id}</td>
            <td>${student.name}</td>
            <td>${student.className}</td>
            <td class="score">${student.score.toFixed(1)}</td>
            <td><span class="badge ${badgeClass}">${statusText}</span></td>
          </tr>
        `;
      }).join("");

      renderPagination();
    }

    function renderPagination() {
      let items = `
        <li class="page-item ${currentPage === 1 ? "disabled" : ""}">
          <button class="page-link" type="button" data-page="${currentPage - 1}"
            aria-label="Trang trước">&laquo;</button>
        </li>
      `;

      for (let page = 1; page <= totalPages; page++) {
        items += `
          <li class="page-item ${page === currentPage ? "active" : ""}">
            <button class="page-link" type="button" data-page="${page}"
              ${page === currentPage ? 'aria-current="page"' : ""}>
              ${page}
            </button>
          </li>
        `;
      }

      items += `
        <li class="page-item ${currentPage === totalPages ? "disabled" : ""}">
          <button class="page-link" type="button" data-page="${currentPage + 1}"
            aria-label="Trang tiếp theo">&raquo;</button>
        </li>
      `;

      pagination.innerHTML = items;
    }

    pagination.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-page]");
      if (!button) return;

      const requestedPage = Number(button.dataset.page);
      if (requestedPage < 1 || requestedPage > totalPages) return;

      currentPage = requestedPage;
      renderStudents();
    });

    renderStudents();
  </script>
</body>
</html>
