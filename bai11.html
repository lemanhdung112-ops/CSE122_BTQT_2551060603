<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư viện ảnh Việt Nam</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      color: #94a3b8;
      font-size: 17px;
    }

    .gallery {
      max-width: 1260px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    figure {
      margin: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #1e293b;
    }

    figure img {
      display: block;
      width: 100%;
      height: 214px;
      object-fit: cover;
    }

    figcaption {
      padding: 14px 17px;
      color: #cbd5e1;
      font-size: 16px;
    }

    @media (max-width: 800px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .gallery {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Thư viện ảnh Việt Nam</h1>
    <p>Bộ sưu tập 6 danh thắng tiêu biểu — minh họa thẻ figure / figcaption.</p>
  </header>

  <main class="gallery">
    <figure>
      <img src="Anh/Bai11/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
      <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
    </figure>

    <figure>
      <img src="Anh/Bai11/2-son-doong.jpg" alt="Hang Sơn Đoòng">
      <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
    </figure>

    <figure>
      <img src="Anh/Bai11/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
      <figcaption>Hình 3. Thác Bản Giốc</figcaption>
    </figure>

    <figure>
      <img src="Anh/Bai11/4-fansipan.jpg" alt="Fansipan">
      <figcaption>Hình 4. Fansipan</figcaption>
    </figure>

    <figure>
      <img src="Anh/Bai11/5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
      <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
    </figure>

    <figure>
      <img src="Anh/Bai11/6-phong-nha.jpg" alt="Động Phong Nha">
      <figcaption>Hình 6. Động Phong Nha</figcaption>
    </figure>
  </main>
</body>
</html>
